server.port=8083
spring.application.name=library-management

# --- Database (DB3 - 33063 external mapping) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/book_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD:library_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis

# --- Other Configs ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
file.upload-dir=${UPLOAD_DIR:${user.home}/library-uploads}
server.servlet.session.timeout=30m