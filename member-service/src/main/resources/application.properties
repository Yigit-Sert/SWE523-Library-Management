server.port=8081
spring.application.name=library-management

# --- Database (DB1 - 33061 external mapping, internal standard) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/member_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD:library_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis

# --- OAuth2 & Other Configs ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
file.upload-dir=${UPLOAD_DIR:${user.home}/library-uploads}
server.servlet.session.timeout=30m
server.forward-headers-strategy=native
app.base-url=${APP_BASE_URL:http://localhost}